upcoming_talks:
  - title: "BewAIre: Detecting Malicious Pull Requests at Scale with LLMs"
    type: "Breakout"
    event: "BlackHat USA 2026"
    location: "Las Vegas, NV"
    date: "August 2026"
    description: "As AI coding assistants accelerate software development, the volume of pull requests at Datadog has grown to nearly 10,000 per week, increasing the risk that malicious changes slip through due to review fatigue. To address this, Datadog built BewAIre, an LLM-powered code review system designed to identify malicious source code changes introduced by threat actors. By reducing approval fatigue for developers while increasing friction for attackers, BewAIre guides human reviewers to the areas where judgment matters most, without slowing developer velocity. In this breakout session, Andrew Krug (Head of Security Advocacy) will share why BewAIre was built, how it evolved from a hackathon experiment into a production-grade internal system, and the key architectural decisions and trade-offs involved along the way. He will discuss what worked, what didn't, and the limitations the team encountered when applying LLMs to security-critical workflows. He will also cover how BewAIre is now being integrated into Datadog Code Security, and what it takes to turn an internal engineering tool into a product capability used at scale. Attendees will leave with practical lessons on building, hardening, and productizing LLM-powered systems and how you can use LLMs to minimize the security risks introduced by the new LLM-code-generation paradigm. Day and time TBD."
    tags: ["AI Security", "LLMs", "Supply Chain Security", "DevSecOps"]
    links:
      - title: "BlackHat USA 2026"
        url: "https://blackhat.com/us-26/"

  - title: "Emulate Cloud-Native Attacks with Stratus Red Team"
    type: "Arsenal"
    event: "BlackHat USA 2026"
    location: "Las Vegas, NV"
    date: "August 5, 2026"
    description: "What attacks are used by threat actors in cloud environments? How do you reproduce them easily to ensure that your threat detection mechanisms are working as expected? Stratus Red Team provides a solution to these two questions. With support for AWS, Azure, Google Cloud, Entra ID, and Kubernetes, it allows threat detection and cloud security engineering teams to reproduce common cloud attacks in a self-contained manner, along with actionable detection insights. Wednesday, August 5, 1:40pm–2:40pm at Arsenal Station 1, Business Hall."
    tags: ["Cloud Security", "Threat Detection", "Adversary Emulation", "Open Source"]
    links:
      - title: "Session Details"
        url: "https://blackhat.com/us-26/arsenal/schedule/index.html#emulate-cloud-native-attacks-with-stratus-red-team-53058"

  - title: "Eliminating Blindspots in your security monitoring strategy"
    type: "Breakout"
    event: "AWS re:Inforce 2025"
    location: "Philadelphia, PA"
    date: "June 17, 2025"
    description: "Cloud security is being shaped by the rapid adoption of technologies like Generative AI, Kubernetes, and SaaS platforms, making comprehensive security monitoring more critical than ever. This session will explore strategies to eliminate blind spots in your security monitoring strategy. We will focus on precise instrumentation and data collection, and demonstrate an end-to-end detection strategy that includes cloud audit logs, runtime security, and data enrichment. The session will also emphasize leveraging runtime context to enhance threat detection and response. Participants will learn how to build a robust security monitoring framework that can adapt to evolving cloud technologies and ensure thorough coverage. This presentation is brought to you by Datadog, an AWS Partner."
    tags: ["Cloud", "Cloud Security", "SIEM", "Practitioner"]
    links:
      - title: "Watch Recording"
        url: "https://www.youtube.com/watch?v=ocB506XpQT0"


