featured_articles:
  - title: "Key learnings from the 2026 State of DevSecOps study"
    publication: "Datadog"
    date: "March 2026"
    featured: true
    description: "Datadog's DevSecOps research identifies critical vulnerabilities in deployment practices, revealing that nearly all organizations have exploitable security gaps, while recommending safer dependency upgrade strategies and improved GitHub Actions security."
    tags: ["DevSecOps", "Cloud", "Security", "Research"]
    url: "https://www.datadoghq.com/blog/devsecops-2026-study-learnings/"

  - title: "Key learnings from the 2025 State of Cloud Security study"
    publication: "Datadog"
    date: "November 2025"
    description: "The 2025 State of Cloud Security research reveals why organizations should adopt multi-account AWS architectures, implement data perimeters, eliminate long-lived credentials, enforce IMDSv2, block public storage access, and limit workload permissions."
    tags: ["Cloud Security", "AWS", "Azure", "Google Cloud"]
    url: "https://www.datadoghq.com/blog/cloud-security-study-learnings-2025/"

